# Sharding 数据源配置
sharding:
  ds0:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3307/sandbox_demo_mysql?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&allowMultiQueries=true&rewriteBatchedStatements=true
    username: root
    password: 123456

  ds1:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3309/sandbox_demo_mysql?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&allowMultiQueries=true&rewriteBatchedStatements=true
    username: root
    password: 123456

  ds0slave0:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3308/sandbox_demo_mysql?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&allowMultiQueries=true&rewriteBatchedStatements=true
    username: root
    password: 123456

  ds1slave0:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3310/sandbox_demo_mysql?useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8&allowMultiQueries=true&rewriteBatchedStatements=true
    username: root
    password: 123456

  basic:
    # 基础连接池配置
    max-active: 20
    min-idle: 5
    initial-size: 1                    # 降低初始连接数，加快启动

    # 连接等待配置
    max-wait: 10000

    # 连接泄漏检测 - 生产环境关闭
    remove-abandoned: false             # 关键：关闭removeAbandoned
    remove-abandoned-timeout: 1800
    log-abandoned: false

    # 空闲连接检查
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 300000

    # 连接测试配置 - 优化启动速度
    validation-query: SELECT 1
    test-while-idle: true
    test-on-borrow: false                # 关闭borrow时测试
    test-on-return: false                # 关闭return时测试

  #数局库字段加密 配置
  aes:
    key: 7F2A8C3B9D4E5F1A6B2C3D4E5F6A7B8C
  # ========== 加密配置 ==========
  encrypt:
    tables:
      - table-name: t_user
        columns:
          - phone
      - table-name: t_order
        columns:
          - receiver_phone
          - receiver_address
  # ========== 分库分表配置 ==========
  rules:
    - table-name: t_user                    # 逻辑表名
      database-sharding:
        sharding-column: phone              # 分库字段
        algorithm-type: DB_MOD              # 算法类型
        count: 2                            # 分库数量
      table-sharding:
        sharding-column: id                 # 分表字段
        algorithm-type: TABLE_MOD           # 算法类型
        count: 2                            # 分表数量

    # 只分表（不分库）
    - table-name: t_config
      database-sharding:
        count: 1                            # count=1 即不分库
        sharding-column: ""
        algorithm-type: ""
      table-sharding:
        sharding-column: config_key
        algorithm-type: TABLE_MOD
        count: 4

    # 只分库（不分表）
    - table-name: t_log
      database-sharding:
        sharding-column: user_id
        algorithm-type: DB_MOD
        count: 2
      table-sharding:
        count: 1                            # count=1 即不分表
        sharding-column: ""
        algorithm-type: ""


# Mybatis-Plus 配置
mybatis-plus:
  datacenter-id: 0
  mapper-locations: classpath*:mapper/**/*.xml  # Mapper XML 文件位置
  global-config:
    db-config:
      id-type: assign_id  # 主键ID策略